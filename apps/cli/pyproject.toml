[project]
name = "agent-cli"
version = "0.0.1"
description = "Agent command-line client"
requires-python = "==3.15.0"
dependencies = [
    "agent-core",
    "typer==0.29.1",
    "httpx==0.28.1",
    "textual==8.2.8",
    "pyte==0.8.2",
]

[project.optional-dependencies]
# Image generation and reel media tools (Apple Silicon Macs only): the dependencies live in agent-core.
image = ["agent-core[image]"]
media = ["agent-core[media]"]

[tool.uv]
# The CLI is Unix-only (ptys). Without this, uv's universal lock fails on the `image` extra: mflux's other-platform
# dependencies (mlx[cuda13]==0.32.2) have no cp315 wheels, even though the extra is limited to Apple Silicon.
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

[tool.uv.sources]
agent-core = { path = "../core", editable = true }

[project.scripts]
agent = "src.main:main"

[dependency-groups]
dev = [
    "ruff==0.17.0",
    "ty==0.0.86",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # PtyProcess.spawn forks while asyncio threads may exist; the child only execs (see its docstring)
    "ignore:This process .* is multi-threaded:DeprecationWarning",
]
