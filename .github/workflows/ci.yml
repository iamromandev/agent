# Runs what the pre-commit hooks run, on the assumption that nobody ran them:
# a hook is a local courtesy that any clone can skip.
name: CI

on:
  pull_request:
  push:
    branches: [dev]

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: api, cli — lint, types
    runs-on: ubuntu-latest
    steps:
      # Full history: moon compares against the dev branch (vcs.defaultBranch) to find changed projects.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Installs proto and moon (moon at the .prototools version). Python comes from uv
      # (``requires-python`` / ``.python-version``). ``**/*.lock`` is gitignored,
      # so ``uv sync`` resolves afresh here.
      - name: Install toolchain
        uses: moonrepo/setup-toolchain@v0

      # setup-toolchain installs proto and moon only; uv comes from setup-uv at the .prototools version.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.10"
          enable-cache: true
          cache-dependency-glob: apps/*/pyproject.toml

      # ``check-ci`` rather than ``check``: ``ruff check --fix`` exits 0 once it
      # has fixed what it found, so it would pass a branch that does not lint.
      - name: Lint and type-check
        run: moon run api:check-ci cli:check-ci

  ui:
    name: ui — formatting, types
    runs-on: ubuntu-latest
    steps:
      # Full history: moon compares against the dev branch (vcs.defaultBranch) to find changed projects.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install toolchain
        uses: moonrepo/setup-toolchain@v0

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      # No --frozen-lockfile: ``apps/ui/bun.lock`` is gitignored. Direct dependencies
      # are exactly pinned in package.json; their transitives are not.
      - name: Install dependencies
        run: moon run ui:install

      - name: Formatting and types
        run: moon run ui:format-check ui:check
